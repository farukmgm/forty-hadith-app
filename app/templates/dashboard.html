{% extends 'base.html' %}

{% block title %}Dashboard — Forty Hadith{% endblock %}

{% block content %}
<div class="container my-4">
  <div class="card p-4">
    <h2>Welcome back, {{ current_user.username }}!</h2>
    <p class="text-muted">This is your dashboard. Quick links:</p>
    <div class="d-flex gap-2">
      <a class="btn btn-primary" href="{{ url_for('main.progress') }}">My Progress</a>
      <a class="btn btn-outline-primary" href="{{ url_for('main.stats') }}">Statistics</a>
      <a class="btn btn-outline-secondary" href="{{ url_for('main.hadiths') }}">Hadiths</a>
    </div>
  </div>
</div>
{% endblock %}
